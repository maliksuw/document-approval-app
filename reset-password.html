<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<title>ตั้งรหัสผ่านใหม่ - ระบบอนุมัติเอกสาร</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <h1>ตั้งรหัสผ่านใหม่</h1>

    <form id="resetForm" class="hidden">
      <label>รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)</label>
      <input type="password" id="newPassword" required minlength="6" />
      <label>ยืนยันรหัสผ่านใหม่</label>
      <input type="password" id="confirmPassword" required minlength="6" />
      <button type="submit" class="btn-primary">บันทึกรหัสผ่านใหม่</button>
    </form>

    <p id="invalidLinkMsg" class="hidden">
      ลิงก์นี้หมดอายุหรือไม่ถูกต้อง กรุณาขอลิงก์ใหม่จากหน้า
      <a href="login.html">เข้าสู่ระบบ</a>
    </p>

    <p id="feedback"></p>
  </div>

  <script src="js/supabaseClient.js"></script>
  <script src="js/resetPassword.js"></script>
</body>
</html>
